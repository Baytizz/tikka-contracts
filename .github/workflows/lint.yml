name: Lint Workflows

on:
  push:
    paths: [ '.github/workflows/**' ]
  pull_request:
    paths: [ '.github/workflows/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        timeout-minutes: 3
        run: |
          bash <(curl -s --retry 3 https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest
          ./actionlint -color .github/workflows/*.yml
