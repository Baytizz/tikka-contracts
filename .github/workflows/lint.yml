name: Lint Workflows

on:
  push:
    paths: [ '.github/workflows/**' ]
  pull_request:
    paths: [ '.github/workflows/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_CHECKSUM: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${ACTIONLINT_CHECKSUM}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz
          sudo mv actionlint /usr/local/bin/
      - name: Run actionlint
        run: actionlint -color .github/workflows/*.yml
