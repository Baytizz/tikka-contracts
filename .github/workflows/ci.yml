name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Build Contracts
      run: cargo build --target wasm32-unknown-unknown --release

    - name: Check WASM Binary Size (128KB limit)
      run: |
        MAX_SIZE=131072
        FAILED=0
        for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
          [ -e "$wasm" ] || continue
          SIZE=$(stat -c%s "$wasm")
          echo "$wasm: ${SIZE} bytes"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: $wasm exceeds 128KB limit (${SIZE} > ${MAX_SIZE} bytes)"
            FAILED=1
          fi
        done
        exit $FAILED

    - name: Check Error Docs Sync
      run: |
        python3 scripts/generate_error_docs.py
        git diff --exit-code docs/ERRORS.md || (echo "ERROR: docs/ERRORS.md is out of sync with Error enum in contracts/raffle-instance/src/lib.rs. Run 'python scripts/generate_error_docs.py' to update." && exit 1)

    - name: Run Linter (Clippy)
      run: cargo clippy --all-targets --all-features -- -D warnings

    # Prefer `cargo test --workspace` over bare `cargo test` so all crates run.
    - name: Run Tests
      run: cargo test --workspace

  shellcheck:
    name: Shell Script Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  oracle_check:
    name: Oracle Service CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: oracle/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting (Prettier)
        run: npm run format:check
      - name: TypeScript compile check
        run: npm run build
      - name: Run tests
        run: npm test
        continue-on-error: true
