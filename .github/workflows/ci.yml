name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match STELLAR_CLI_VERSION in scripts/common.sh (issues #841, #843).
  STELLAR_CLI_VERSION: "23.4.1"

jobs:
  build_and_test:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # rust-toolchain.toml is the single source of truth for the compiler
    # version, components and WASM target (issues #841, #843).
    - name: Set up pinned Rust toolchain
      run: |
        rustup toolchain install "$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)"
        rustup show

    - name: Rust Cache
      uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

    - name: Install Stellar CLI
      timeout-minutes: 5
      run: |
        curl -sSL --retry 3 --retry-delay 5 \
          "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz
        sudo mv stellar /usr/local/bin/stellar
        stellar --version

    - name: Check Formatting
      run: cargo fmt --all -- --check

    - name: Check for Orphaned Modules
      run: python3 scripts/check_orphan_modules.py

    # Build through the Stellar CLI so CI produces the same artifacts the deploy
    # scripts upload — previously CI built wasm32-unknown-unknown while
    # deploy-testnet.sh deployed wasm32v1-none (issue #841).
    - name: Build Contracts
      run: stellar contract build

    # Size-gates the artifacts that are actually deployed. The limit and the
    # paths live in scripts/common.sh so they cannot drift apart again.
    - name: Check WASM Binary Size (128KB limit)
      run: |
        source scripts/common.sh
        check_wasm_sizes

    - name: Check Error Docs Sync
      run: |
        python3 scripts/generate_error_docs.py
        git diff --exit-code docs/ERRORS.md || (echo "ERROR: docs/ERRORS.md is out of sync with Error enum in contracts/raffle-instance/src/lib.rs. Run 'python scripts/generate_error_docs.py' to update." && exit 1)

    - name: Run Linter (Clippy)
      run: cargo clippy --all-targets --all-features -- -D warnings

    # Prefer `cargo test --workspace` over bare `cargo test` so all crates run.
    - name: Run Tests
      run: cargo test --workspace

    - name: Run Documentation Tests
      run: cargo test --workspace --doc

  shellcheck:
    name: Shell Script Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  oracle_check:
    name: Oracle Service CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: oracle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: oracle/package-lock.json
      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Check formatting (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: TypeScript compile check
        run: npm run build
      - name: Run tests
        run: npm run test:ci
