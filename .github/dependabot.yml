# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Cargo dependencies (Rust workspace)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      # Group non-breaking updates together
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "rust"
      - "ci/cd"
    open-pull-requests-limit: 10
    reviewers:
      - "tikka-contracts-maintainers"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # npm dependencies (Oracle service)
  - package-ecosystem: "npm"
    directory: "/oracle"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      # Group non-breaking updates together
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "javascript"
      - "oracle"
      - "ci/cd"
    open-pull-requests-limit: 10
    reviewers:
      - "tikka-contracts-maintainers"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    groups:
      # Group all action updates together
      github-actions-all:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci/cd"
    open-pull-requests-limit: 5
    reviewers:
      - "tikka-contracts-maintainers"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
